packages:
  - packages/*

# pnpm 11 supply-chain / build-script policy. Committed so `pnpm install
# --frozen-lockfile` in CI does not re-prompt for an undecided build script.
allowBuilds:
  # esbuild's binary ships via the platform-specific optional dependency
  # (`@esbuild/linux-x64` etc.), so its postinstall is redundant — deny it.
  esbuild: false
  # Required only by the official JSONL session backend used in lifecycle tests.
  koffi: true

minimumReleaseAge: 1440

# RC.1 package manifests use semver peer ranges. Keep the repository's
# executable dependency graph on one reviewed DSH identity.
overrides:
  '@deepseek-ai/dsh-agent-loop': 0.1.2-rc.1
  '@deepseek-ai/dsh-agent': 0.1.2-rc.1
  '@deepseek-ai/dsh-attachment': 0.1.2-rc.1
  '@deepseek-ai/dsh-brand': 0.1.2-rc.1
  '@deepseek-ai/dsh-code-runtime': 0.1.2-rc.1
  '@deepseek-ai/dsh-invariants': 0.1.2-rc.1
  '@deepseek-ai/dsh-llm': 0.1.2-rc.1
  '@deepseek-ai/dsh-mcp-client': 0.1.2-rc.1
  '@deepseek-ai/dsh-scope': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-persistence-jsonl': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-persistence': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-projection': 0.1.2-rc.1
  '@deepseek-ai/dsh-session': 0.1.2-rc.1
  '@deepseek-ai/dsh-settings': 0.1.2-rc.1
  '@deepseek-ai/dsh-subprocess': 0.1.2-rc.1
  '@deepseek-ai/dsh-system-prompt': 0.1.2-rc.1
  '@deepseek-ai/dsh-timeout': 0.1.2-rc.1
  '@deepseek-ai/dsh-tools': 0.1.2-rc.1
  '@deepseek-ai/dsh-typert-protocol': 0.1.2-rc.1
  '@deepseek-ai/dsh-user-approval': 0.1.2-rc.1
  '@deepseek-ai/dsh-util-crypto': 0.1.2-rc.1
  '@deepseek-ai/dsh-util-values': 0.1.2-rc.1
  # Do not let a DSH-only rebaseline advance the unrelated bundler graph.
  rolldown: 1.2.6

# Every exception is an exact package/version from the manually reviewed DSH
# 0.1.2-rc.1 source identity pinned in scripts/dsh-target.mjs.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-loop@0.1.2-rc.1'
  - '@deepseek-ai/dsh-agent@0.1.2-rc.1'
  - '@deepseek-ai/dsh-attachment@0.1.2-rc.1'
  - '@deepseek-ai/dsh-brand@0.1.2-rc.1'
  - '@deepseek-ai/dsh-code-runtime@0.1.2-rc.1'
  - '@deepseek-ai/dsh-invariants@0.1.2-rc.1'
  - '@deepseek-ai/dsh-llm@0.1.2-rc.1'
  - '@deepseek-ai/dsh-mcp-client@0.1.2-rc.1'
  - '@deepseek-ai/dsh-scope@0.1.2-rc.1'
  - '@deepseek-ai/dsh-session-persistence-jsonl@0.1.2-rc.1'
  - '@deepseek-ai/dsh-session-persistence@0.1.2-rc.1'
  - '@deepseek-ai/dsh-session-projection@0.1.2-rc.1'
  - '@deepseek-ai/dsh-session@0.1.2-rc.1'
  - '@deepseek-ai/dsh-settings@0.1.2-rc.1'
  - '@deepseek-ai/dsh-subprocess@0.1.2-rc.1'
  - '@deepseek-ai/dsh-system-prompt@0.1.2-rc.1'
  - '@deepseek-ai/dsh-timeout@0.1.2-rc.1'
  - '@deepseek-ai/dsh-tools@0.1.2-rc.1'

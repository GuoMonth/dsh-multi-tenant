packages:
  - packages/*

# Reject installs on Node versions outside the declared engines range.
engineStrict: true

# The platform has no DSH dependencies; native fixtures have their own frozen policy.
allowBuilds:
  esbuild: false
minimumReleaseAge: 1440

# RC.3's lockfile qualifies different Rolldown lines for its two build consumers.
overrides:
  tsdown>rolldown: 1.1.1
  vite>rolldown: 1.2.7

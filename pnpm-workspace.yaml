packages:
  - packages/*

# pnpm 11 supply-chain / build-script policy. Committed so `pnpm install
# --frozen-lockfile` in CI does not re-prompt for an undecided build script.
allowBuilds:
  # esbuild's binary ships via the platform-specific optional dependency
  # (`@esbuild/linux-x64` etc.), so its postinstall is redundant — deny it.
  esbuild: false
  # Required only by the official JSONL session backend used in lifecycle tests.
  koffi: true

minimumReleaseAge: 1440

# Upstream package manifests use semver peer ranges. Keep the repository's
# executable dependency graph on one reviewed DSH identity.
overrides:
  '@deepseek-ai/dsh-util-time': 0.1.5-rc.2
  '@deepseek-ai/dsh-chunked-list': 0.1.5-rc.2
  '@deepseek-ai/dsh-subagent-in-process-driver': 0.1.5-rc.2
  '@deepseek-ai/dsh-subagent-fork-in-process': 0.1.5-rc.2
  '@deepseek-ai/dsh-subagent-spawn-in-process': 0.1.5-rc.2
  '@deepseek-ai/dsh-subagent': 0.1.5-rc.2
  '@deepseek-ai/dsh-tool-todo': 0.1.5-rc.2
  '@deepseek-ai/dsh-session-title': 0.1.5-rc.2

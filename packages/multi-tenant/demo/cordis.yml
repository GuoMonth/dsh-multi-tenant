# Minimal composition that loads dsh-multi-tenant through the real Cordis
# Loader (not direct service construction), plus a fixture plugin that exercises
# both the shared ownership kernel and context-native runtime. `../src/*`
# resolves against the demo directory's base URL, mirroring the shipped bundle
# rows while using an in-memory SQLite database so the fixture stays hermetic.
- id: tenant-session-store
  name: '../src/sqlite-store.ts'
  config:
    path: ':memory:'

- id: multi-tenant
  name: '../src/index.ts'

- id: tenant-runtime
  name: '../src/runtime.ts'

- id: fixture
  name: './fixture.ts'

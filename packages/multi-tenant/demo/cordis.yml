# Minimal composition that loads dsh-multi-tenant through the real Cordis
# Loader (not direct service construction), plus a fixture plugin that exercises
# both the shared v0.1 kernel and v0.2 context-native runtime. `../src/*` resolves
# against the demo directory's base URL, mirroring the three shipped bundle rows.
- id: tenant-session-store
  name: '../src/store.ts'

- id: multi-tenant
  name: '../src/index.ts'

- id: tenant-runtime
  name: '../src/runtime.ts'

- id: fixture
  name: './fixture.ts'

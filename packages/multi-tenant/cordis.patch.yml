# DeepSeek Harness bundle layer.
#
# The ownership kernel and Tenant Runtime stay deployment-global. Product
# capability providers are materialized later inside canonical Runtime scopes.
#
# The First Product Experience starter is deliberately present as a dormant
# row only. It publishes demo identities/routes exclusively when the operator
# explicitly launches with DSH_MULTI_TENANT_STARTER=1.
- insert:
    - id: tenant-session-store
      name: dsh-multi-tenant/store

    - id: multi-tenant
      name: dsh-multi-tenant

    - id: tenant-runtime
      name: dsh-multi-tenant/runtime

    - id: multi-tenant-starter
      name: dsh-multi-tenant/starter
      config:
        enabled: !!js process.env.DSH_MULTI_TENANT_STARTER === '1'

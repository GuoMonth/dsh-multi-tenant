# DeepSeek Harness bundle layer.
#
# v0.2 keeps the v0.1 ownership kernel deployment-global and adds the
# context-native runtime manager. Tenant/principal capability providers are
# mounted later under contexts minted by `ctx.tenantRuntime`; they are not
# hard-coded into this bundle.
- insert:
    - id: tenant-session-store
      name: dsh-multi-tenant/store

    - id: multi-tenant
      name: dsh-multi-tenant

    - id: tenant-runtime
      name: dsh-multi-tenant/runtime

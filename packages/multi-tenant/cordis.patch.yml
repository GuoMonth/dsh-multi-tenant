# DSH alpha.5 bundle layer. The plugin supplies its SQLite Agent directory and
# shared logical runtime provider unless the host registers replacements first.
- insert:
    - id: multi-tenant
      name: dsh-multi-tenant

    # Opt-in, local-only example identity boundary and Agent CRUD routes.
    - id: multi-tenant-starter
      name: dsh-multi-tenant/starter
      config:
        enabled: !!js process.env.DSH_MULTI_TENANT_STARTER === '1'

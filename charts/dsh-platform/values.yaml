# Supply exact platform/workload digests from the matching release manifest.
platformImage: ""
workloadImage: ""
domain: ""
ingressClassName: ""
tlsSecretName: ""
oidc:
  issuer: ""
  clientId: ""
  secretName: ""
  secretKey: client-secret
  # Optional trust anchor for a private HTTPS issuer; never disables verification.
  caSecretName: ""
  caSecretKey: ca.crt
members: []
storageClassName: ""
storageSize: 10Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
# Platform SQLite storage is administrative state, separate from user PVCs.
controlStorageSize: 1Gi
namespacePrefix: dsh-env

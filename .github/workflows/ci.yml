name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ingress:
    name: Installed native domains and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir scripts/native-host-probe install --frozen-lockfile
      - run: pnpm --dir scripts/native-host-probe exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: pnpm probe:image
      - run: pnpm probe:isolated
        env:
          # Keep native Unix socket paths within Linux's 107-byte limit.
          PROBE_EVIDENCE_DIR: /tmp/dsh-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-ingress-evidence
          path: |
            /tmp/dsh-ci/**/report.json
            /tmp/dsh-ci/**/alice.png
            /tmp/dsh-ci/**/bob.png
            /tmp/dsh-ci/**/alice.txt
            /tmp/dsh-ci/**/bob.txt
          if-no-files-found: ignore

  dsh-source:
    name: Pinned DSH source identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve target
        id: target
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { DSH_TARGET } from './scripts/dsh-target.mjs'
          console.log(`repository=${DSH_TARGET.repository}`)
          console.log(`version=${DSH_TARGET.version}`)
          console.log(`commit=${DSH_TARGET.commit}`)
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.commit }}
          path: .upstream/deepseek-harness
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          test "$(git -C .upstream/deepseek-harness rev-parse HEAD)" = "${{ steps.target.outputs.commit }}"
          test "$(node -p "require('./.upstream/deepseek-harness/package.json').version")" = "${{ steps.target.outputs.version }}"

  quality:
    name: Release contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@${{ matrix.node }}
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete release evidence
        run: pnpm release:check

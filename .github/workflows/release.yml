name: Publish package
run-name: Promote npm dist-tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version
        required: true
        type: string
      tag:
        description: Dist-tag to point at the version
        required: true
        type: string
        default: latest
permissions:
  contents: read
  id-token: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Promote dist-tag through npm trusted publishing
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$'
          printf '%s' "$TAG" | grep -Eq '^[a-z0-9][a-z0-9._-]*$'
          npm install --global npm@11.21.0
          npm --version
          npm dist-tag add "dsh-multi-tenant@${VERSION}" "${TAG}"
          npm dist-tag ls dsh-multi-tenant

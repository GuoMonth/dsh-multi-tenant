name: Publish alpha package

run-name: Publish dsh-multi-tenant from main

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: npm-dsh-multi-tenant-release
  cancel-in-progress: false

jobs:
  publish:
    name: publish dsh-multi-tenant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Release needs npm for Trusted Publishing, so Node comes from setup-node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      # pnpm/setup is the pnpm 11+ successor to pnpm/action-setup. Do not install
      # another Node runtime here: pnpm runtime installs intentionally omit npm.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false

      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run list \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // ""')
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI for release commit $GITHUB_SHA is not successful (conclusion: ${CONCLUSION:-missing})" >&2
            exit 1
          fi

      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from main; got $GITHUB_REF" >&2
            exit 1
          fi
          RELEASE_VERSION=$(node -p "require('./packages/multi-tenant/package.json').version")
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "Publishing dsh-multi-tenant@$RELEASE_VERSION as npm alpha"

          node - <<'NODE'
          const { execFileSync } = require('node:child_process')
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim()
          const [major, minor] = version.split('.').map(Number)
          if (major < 11 || (major === 11 && minor < 5)) {
            throw new Error(`npm ${version} is too old for trusted publishing; require >=11.5.1`)
          }
          console.log(`npm ${version} satisfies trusted-publishing requirements`)
          NODE

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Run full release proof
        run: pnpm release:check

      - name: Check registry ownership and version state
        id: registry
        run: node scripts/registry-preflight.mjs "$RELEASE_VERSION"

      - name: Publish to npm via Trusted Publishing
        if: steps.registry.outputs.publish_needed == 'true'
        working-directory: packages/multi-tenant
        run: npm publish --access public --provenance --tag alpha

      - name: Verify registry artifact and alpha tag
        run: node scripts/registry-smoke.mjs "$RELEASE_VERSION"

      - name: Create matching Git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          git fetch --tags origin

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Existing tag $TAG points to $TAG_SHA, not release commit $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving it unchanged"
          else
            RELEASE_FLAGS=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" \
              --verify-tag \
              "${RELEASE_FLAGS[@]}" \
              --title "dsh-multi-tenant ${RELEASE_VERSION}" \
              --notes-file "docs/releases/v${RELEASE_VERSION}.md"
          fi

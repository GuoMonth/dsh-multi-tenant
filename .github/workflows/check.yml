name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm typecheck
      - run: pnpm test
      # Keep the pre-merge security assertions: package smoke and Helm
      # installation run once on Node 24. The full release acceptance,
      # including the clean installed-package consumer, stays local.
      - if: matrix.node == '24'
        run: |
          bash scripts/install-ci-helm.sh
          pnpm build
          pnpm smoke
          node --test integration/installation/verify.test.mjs

name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Release-owner acceptance; audit-node enforces the 2026-12-02 expiry and exact advisory/version.
      ACCEPT_PICOMATCH_GHSA: GHSA-fc5q-39xc-vjpf
      LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node == '24.9' && '24' || matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        if: matrix.node != '24.9'
      - run: pnpm typecheck
        if: matrix.node != '24.9'
      - run: pnpm test
        if: matrix.node != '24.9'
      - name: Build the published artifact for the supported floor
        if: matrix.node == '24.9'
        run: |
          bash scripts/install-ci-helm.sh
          pnpm build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.node == '24.9'
        with:
          node-version: '24.9'
          package-manager-cache: false
      - name: Consume the installed package at the supported floor
        if: matrix.node == '24.9'
        env:
          npm_config_engine_strict: 'true'
        run: node scripts/artifact-consumer-smoke.mjs
      # Keep the pre-merge security assertions: package smoke and Helm
      # installation run once on Node 24. The full release acceptance,
      # including the clean installed-package consumer, stays local.
      - if: matrix.node == '24'
        run: |
          bash scripts/install-ci-helm.sh
          pnpm build
          pnpm smoke
          node --test integration/installation/verify.test.mjs

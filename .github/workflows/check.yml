name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Release-owner acceptance; audit-node enforces the 2026-12-02 expiry and exact advisory/version.
      ACCEPT_PICOMATCH_GHSA: GHSA-fc5q-39xc-vjpf
      LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.3', '26.13.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and test the installed package
        env:
          npm_config_engine_strict: 'true'
        run: |
          bash scripts/install-ci-helm.sh
          pnpm build
          pnpm smoke
          node --test integration/installation/verify.test.ts

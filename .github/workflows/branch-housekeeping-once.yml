name: Branch Housekeeping Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-housekeeping-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete stale development branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#^refs/heads/##' \
              | sort
          )

          deleted=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "deleting branch: $branch"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done

          echo "deleted_count=$deleted"

          remaining=$(git ls-remote --heads origin | awk '{print $2}' | sed 's#^refs/heads/##' | sort)
          echo "remaining branches:"
          printf '%s\n' "$remaining"
          test "$remaining" = "main"

      - name: Try enabling GitHub native delete-branch-on-merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}" \
            -F delete_branch_on_merge=true

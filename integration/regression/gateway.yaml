# Task-local TLS Secret and platform Service must exist in dsh-system.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dsh
  namespace: dsh-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: dsh
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dsh
  namespace: dsh-system
spec:
  gatewayClassName: dsh
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: dsh
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.cells.test"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dsh-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform
  namespace: dsh-system
spec:
  parentRefs:
    - name: dsh
      sectionName: https
  hostnames: ["*.cells.test"]
  rules:
    - backendRefs:
        - name: platform
          port: 8080

# Apply separately to each allowlisted tenant namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-cell
rules:
  - apiGroups: [dsh.isolated.io]
    resources: [cells]
    verbs: [get, create, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-cell
subjects:
  - kind: ServiceAccount
    name: platform
    namespace: dsh-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-cell
